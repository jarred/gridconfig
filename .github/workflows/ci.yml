name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      # The packages must build: the devtools build inlines its stylesheet, and the Svelte
      # package goes through svelte-package.
      - run: pnpm --filter "./packages/*" build

      - name: Install Chromium
        run: pnpm --filter @gridconfig/conformance exec playwright install --with-deps chromium
      - run: pnpm test:browser
